<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --font-family: 'Inter Tight', 'Segoe UI', Arial, sans-serif;
  --color-primary: #4479D9;       /* hero/section overlay blue used site-wide */
  --color-primary-dark: #2C5AA8;
  --color-accent-red: #FF0000;    /* used sparingly, e.g. for deadline/urgent text */
  --color-success: #28A745;       /* "Submit Now" style CTA green */
  --color-indigo: #6366F1;
  --color-violet: #8B5CF6;
  --color-cyan: #0EA5E9;
  --color-teal: #06B6D4;
  --color-text-dark: #172033;
  --color-text-muted: #64748B;
  --color-bg-light: #F8FAFC;
  --color-border: #E2E8F0;
  --color-input-bg: #FFFFFF;
  --radius-card: 20px;
  --radius-btn: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 10px 35px rgba(15,23,42,0.06), 0 2px 8px rgba(15,23,42,0.03);
  --shadow-card-hover: 0 22px 50px rgba(15,23,42,0.11), 0 8px 20px rgba(99,102,241,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.08);
  --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: var(--font-family);
  background-color: var(--color-bg-light);
  color: var(--color-text-dark);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ================= NAV BAR ================= */
.top-navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(15, 23, 42, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding: 0.6rem 1.5rem;
}

.nav-container {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.nav-brand-group {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  text-decoration: none;
}

.nav-logos {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.nav-logo-img {
  height: 3.6rem;
  width: auto;
  max-width: 120px;
  object-fit: contain;
  transition: transform 0.2s ease;
}

.nav-logo-img:hover {
  transform: scale(1.04);
}

.nav-logo-divider {
  width: 1px;
  height: 2.2rem;
  background: rgba(255, 255, 255, 0.2);
}

.nav-titles {
  display: flex;
  flex-direction: column;
}

.nav-main-title {
  color: #FFFFFF;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-badge {
  font-size: 0.68rem;
  padding: 0.15rem 0.55rem;
  border-radius: 9999px;
  font-weight: 600;
  background: rgba(68, 121, 217, 0.25);
  color: #93C5FD;
  border: 1px solid rgba(147, 197, 253, 0.3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.nav-sub-title {
  color: #94A3B8;
  font-size: 0.8rem;
  font-weight: 400;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 0.8rem;
}

.nav-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.48rem 0.95rem;
  border-radius: var(--radius-btn);
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}

.nav-btn-outline {
  background: rgba(255, 255, 255, 0.08);
  color: #E2E8F0;
  border-color: rgba(255, 255, 255, 0.15);
}

.nav-btn-outline:hover {
  background: rgba(255, 255, 255, 0.18);
  color: #FFFFFF;
}

.nav-btn-primary {
  background: var(--color-primary);
  color: #FFFFFF;
}

.nav-btn-primary:hover {
  background: var(--color-primary-dark);
}

/* ================= HERO HEADER ================= */
.hero-header {
  background: linear-gradient(135deg, #1E293B 0%, #0F172A 50%, #172554 100%);
  color: #FFFFFF;
  padding: 2.8rem 1.5rem 3.5rem;
  position: relative;
  overflow: hidden;
}

.hero-header::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(68, 121, 217, 0.22) 0%, rgba(99, 102, 241, 0.05) 50%, transparent 70%);
  pointer-events: none;
}

.hero-container {
  max-width: 960px;
  margin: 0 auto;
  text-align: center;
  position: relative;
  z-index: 1;
}

.hero-pill-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.35rem 1rem;
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 9999px;
  font-size: 0.82rem;
  font-weight: 500;
  color: #E2E8F0;
  margin-bottom: 1.2rem;
}

.hero-pill-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #38BDF8;
  box-shadow: 0 0 10px #38BDF8;
}

.hero-title {
  font-size: 2.2rem;
  font-weight: 800;
  line-height: 1.25;
  margin-bottom: 0.6rem;
  letter-spacing: -0.02em;
}

.hero-title-gradient {
  background: linear-gradient(135deg, #FFFFFF 30%, #93C5FD 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-theme {
  font-size: 1.15rem;
  font-weight: 500;
  color: #93C5FD;
  font-style: italic;
  margin-bottom: 1rem;
}

.hero-meta-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 1.5rem;
  font-size: 0.88rem;
  color: #CBD5E1;
  margin-bottom: 1.4rem;
}

.hero-meta-item {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.hero-meta-icon {
  color: #60A5FA;
}

/* Urgent Deadline Pill matching live site */
.urgent-notice-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid rgba(239, 68, 68, 0.3);
  padding: 0.5rem 1.2rem;
  border-radius: 9999px;
  box-shadow: 0 4px 15px rgba(255, 0, 0, 0.12);
  margin-top: 0.5rem;
}

.urgent-notice-pill span {
  color: var(--color-accent-red);
  font-weight: 700;
  font-size: 0.84rem;
  letter-spacing: 0.01em;
}

.urgent-icon {
  color: var(--color-accent-red);
}

/* ================= MAIN CONTAINER ================= */
.main-wrapper {
  max-width: 960px;
  width: 100%;
  margin: -1.8rem auto 3rem;
  padding: 0 1.25rem;
  position: relative;
  z-index: 10;
  flex: 1;
}

.admin-wrapper {
  max-width: 1280px;
  width: 100%;
  margin: 1.5rem auto 3rem;
  padding: 0 1.25rem;
  flex: 1;
}

/* ================= CARDS ================= */
.content-card {
  background: #FFFFFF;
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-card);
  border: 1px solid var(--color-border);
  padding: 2rem;
  margin-bottom: 1.8rem;
  transition: var(--transition);
}

.content-card:hover {
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-4px);
}

/* Card Header with Icon Badge */
.card-section-header {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  margin-bottom: 1.8rem;
  padding-bottom: 1.2rem;
  border-bottom: 1px solid #F1F5F9;
}

.icon-badge {
  width: 55px;
  height: 55px;
  border-radius: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
}

.icon-badge-primary {
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-indigo) 100%);
  color: #FFFFFF;
}

.icon-badge-indigo {
  background: linear-gradient(135deg, var(--color-indigo) 0%, var(--color-violet) 100%);
  color: #FFFFFF;
}

.icon-badge-cyan {
  background: linear-gradient(135deg, var(--color-cyan) 0%, var(--color-teal) 100%);
  color: #FFFFFF;
}

.icon-badge-teal {
  background: linear-gradient(135deg, var(--color-teal) 0%, #10B981 100%);
  color: #FFFFFF;
}

.card-title-group h2 {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--color-text-dark);
  line-height: 1.3;
}

.card-title-group p {
  font-size: 0.85rem;
  color: var(--color-text-muted);
  margin-top: 0.2rem;
}

/* ================= FORM GRID ================= */
.form-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 1.2rem 1.2rem;
}

.col-12 { grid-column: span 12; }
.col-8  { grid-column: span 8; }
.col-6  { grid-column: span 6; }
.col-4  { grid-column: span 4; }
.col-3  { grid-column: span 3; }

@media (max-width: 768px) {
  .col-8, .col-6, .col-4, .col-3 {
    grid-column: span 12;
  }
  .hero-title {
    font-size: 1.6rem;
  }
}

/* ================= INPUTS & CONTROLS ================= */
.form-group {
  display: flex;
  flex-direction: column;
}

.form-label {
  font-size: 0.88rem;
  font-weight: 600;
  color: #334155;
  margin-bottom: 0.45rem;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

.req-star {
  color: #EF4444;
  font-weight: 700;
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  padding: 0.65rem 0.9rem;
  font-family: var(--font-family);
  font-size: 0.9rem;
  color: var(--color-text-dark);
  background-color: var(--color-input-bg);
  border: 1.5px solid #CBD5E1;
  border-radius: var(--radius-btn);
  transition: var(--transition);
  outline: none;
}

.form-input:hover,
.form-select:hover,
.form-textarea:hover {
  border-color: #94A3B8;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(68, 121, 217, 0.18);
  background-color: #FFFFFF;
}

.form-input.is-invalid,
.form-select.is-invalid,
.form-textarea.is-invalid {
  border-color: #EF4444;
  background-color: #FEF2F2;
}

.form-input.is-valid,
.form-select.is-valid,
.form-textarea.is-valid {
  border-color: #10B981;
}

.input-helper {
  font-size: 0.78rem;
  color: var(--color-text-muted);
  margin-top: 0.35rem;
}

.input-error {
  font-size: 0.78rem;
  color: #EF4444;
  margin-top: 0.35rem;
  display: none;
  font-weight: 500;
}

.input-error.show {
  display: block;
}

.form-textarea {
  resize: vertical;
  min-height: 80px;
}

/* ================= UPLOAD ZONE ================= */
.upload-card-wrapper {
  background: #F8FAFC;
  border: 2px dashed #CBD5E1;
  border-radius: 14px;
  padding: 1.2rem;
  text-align: center;
  position: relative;
  transition: var(--transition);
}

.upload-card-wrapper:hover {
  border-color: var(--color-primary);
  background: #F0F7FF;
}

.upload-card-wrapper.has-file {
  border-style: solid;
  border-color: #10B981;
  background: #F0FDF4;
}

.upload-card-wrapper.is-uploading {
  border-color: var(--color-primary);
  background: #EFF6FF;
}

.upload-icon-circle {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #E2E8F0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 0.6rem;
  color: #475569;
  transition: var(--transition);
}

.upload-card-wrapper:hover .upload-icon-circle {
  background: rgba(68, 121, 217, 0.15);
  color: var(--color-primary);
}

.upload-title {
  font-size: 0.9rem;
  font-weight: 700;
  color: #1E293B;
}

.upload-hint {
  font-size: 0.75rem;
  color: var(--color-text-muted);
  margin-top: 0.2rem;
  margin-bottom: 0.8rem;
}

.file-input-hidden {
  display: none;
}

.upload-btn-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.9rem;
  font-size: 0.8rem;
  font-weight: 600;
  background: #FFFFFF;
  color: var(--color-primary);
  border: 1.5px solid var(--color-primary);
  border-radius: var(--radius-btn);
  cursor: pointer;
  transition: var(--transition);
}

.upload-btn-trigger:hover {
  background: var(--color-primary);
  color: #FFFFFF;
}

/* Upload thumbnail & preview */
.upload-preview-box {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.preview-thumb {
  width: 100px;
  height: 100px;
  object-fit: cover;
  border-radius: 8px;
  border: 2px solid #FFFFFF;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
}

.preview-badge-success {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.75rem;
  font-weight: 600;
  color: #059669;
  background: #D1FAE5;
  padding: 0.2rem 0.6rem;
  border-radius: 9999px;
}

.upload-spinner {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.spinner {
  width: 28px;
  height: 28px;
  border: 3px solid rgba(68, 121, 217, 0.25);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ================= DECLARATION CARD ================= */
.declaration-card {
  background: #F8FAFC;
  border: 1.5px solid #CBD5E1;
  border-radius: 14px;
  padding: 1.2rem;
  margin-top: 1rem;
}

.declaration-label {
  display: flex;
  align-items: flex-start;
  gap: 0.8rem;
  cursor: pointer;
  user-select: none;
}

.custom-checkbox {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  border: 2px solid #94A3B8;
  flex-shrink: 0;
  margin-top: 0.15rem;
  cursor: pointer;
  accent-color: var(--color-primary);
}

.declaration-text {
  font-size: 0.88rem;
  color: #1E293B;
  font-weight: 500;
  line-height: 1.5;
}

/* ================= CTA BUTTONS ================= */
.btn-submit-main {
  width: 100%;
  padding: 0.95rem 1.8rem;
  font-family: var(--font-family);
  font-size: 1.05rem;
  font-weight: 700;
  color: #FFFFFF;
  background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(68, 121, 217, 0.35);
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
}

.btn-submit-main:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(68, 121, 217, 0.45);
}

.btn-submit-main:disabled {
  background: #94A3B8;
  cursor: not-allowed;
  box-shadow: none;
  opacity: 0.75;
}

/* ================= SUCCESS STATE RECEIPT ================= */
.success-screen {
  display: none;
  text-align: center;
  padding: 3rem 1.5rem;
}

.success-check-badge {
  width: 80px;
  height: 80px;
  background: #D1FAE5;
  color: #059669;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 2.5rem;
  margin-bottom: 1.2rem;
  box-shadow: 0 8px 25px rgba(16, 185, 129, 0.25);
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0.4); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.receipt-card {
  background: #F8FAFC;
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 1.5rem;
  max-width: 500px;
  margin: 1.8rem auto;
  text-align: left;
}

.receipt-row {
  display: flex;
  justify-content: space-between;
  padding: 0.5rem 0;
  border-bottom: 1px dashed #E2E8F0;
  font-size: 0.88rem;
}

.receipt-row:last-child {
  border-bottom: none;
}

.receipt-label {
  color: var(--color-text-muted);
}

.receipt-val {
  font-weight: 600;
  color: var(--color-text-dark);
}

/* ================= ADMIN SPECIFIC STYLES ================= */
.admin-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.8rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.admin-header-title h1 {
  font-size: 1.6rem;
  font-weight: 800;
  color: var(--color-text-dark);
}

.admin-header-title p {
  color: var(--color-text-muted);
  font-size: 0.88rem;
}

.admin-user-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  padding: 0.4rem 0.9rem;
  border-radius: 9999px;
  box-shadow: var(--shadow-sm);
}

.role-badge {
  font-size: 0.72rem;
  font-weight: 700;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  background: #EEF2FF;
  color: var(--color-indigo);
  text-transform: uppercase;
}

/* Stat Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.2rem;
  margin-bottom: 1.8rem;
}

.stat-card {
  background: #FFFFFF;
  border-radius: 16px;
  border: 1px solid var(--color-border);
  padding: 1.3rem;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 1.2rem;
  transition: var(--transition);
}

.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.stat-icon {
  width: 50px;
  height: 50px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
}

.stat-val {
  font-size: 1.7rem;
  font-weight: 800;
  color: var(--color-text-dark);
  line-height: 1.1;
}

.stat-label {
  font-size: 0.8rem;
  color: var(--color-text-muted);
  margin-top: 0.2rem;
}

/* Admin Toolbar */
.admin-toolbar {
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  border-radius: 14px;
  padding: 1rem 1.2rem;
  margin-bottom: 1.4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
}

.search-box-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex: 1;
  min-width: 250px;
  max-width: 450px;
  position: relative;
}

.search-icon {
  position: absolute;
  left: 0.8rem;
  color: #94A3B8;
}

.search-input {
  width: 100%;
  padding: 0.55rem 0.8rem 0.55rem 2.4rem;
  font-family: var(--font-family);
  font-size: 0.88rem;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-btn);
  outline: none;
  transition: var(--transition);
}

.search-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px rgba(68, 121, 217, 0.15);
}

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 0.7rem;
}

/* Data Table */
.table-responsive {
  background: #FFFFFF;
  border: 1px solid var(--color-border);
  border-radius: 16px;
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  text-align: left;
}

.data-table th {
  background: #F8FAFC;
  color: #475569;
  font-weight: 700;
  padding: 0.9rem 1rem;
  border-bottom: 2px solid var(--color-border);
  white-space: nowrap;
}

.data-table td {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid #F1F5F9;
  vertical-align: middle;
}

.data-table tbody tr:hover {
  background-color: #F8FAFC;
}
